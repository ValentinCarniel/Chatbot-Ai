<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chatbot Reclamos Vecinales</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
    <div class="container mt-5" style="max-width: 600px;">
        <h1 class="mb-4 text-center">Reclamos Vecinales</h1>

        <form id="reclamoForm" enctype="multipart/form-data" class="border p-4 rounded shadow-sm bg-light">
            <div class="mb-3">
                <label for="user_message" class="form-label">Tu mensaje:</label>
                <textarea class="form-control" id="user_message" name="user_message" rows="3" required></textarea>
            </div>

            <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" value="true" id="enabled" name="enabled" checked />
                <label class="form-check-label" for="enabled">
                    Habilitado
                </label>
            </div>

            <div class="mb-3">
                <label for="file" class="form-label">Subir imagen (opcional):</label>
                <input class="form-control" type="file" id="file" name="file" />
            </div>

            <button type="submit" class="btn btn-primary w-100">Enviar Reclamo</button>
        </form>

        <div id="resultado" class="mt-4"></div>
    </div>

    <!-- Bootstrap JS Bundle (Popper + Bootstrap JS) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Tu script JS -->
    <script src="script.js"></script>
</body>
</html>
