<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat con IA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              "admin-green": "#059669",
              "admin-green-dark": "#047857",
              "admin-green-light": "#10b981",
              "whatsapp-green": "#25D366",
              "whatsapp-dark": "#128C7E",
            },
          },
        },
      };
    </script>
  </head>
  <body class="bg-gray-50 min-h-screen">
    <!-- Sidebar -->
    <div
      class="fixed inset-y-0 left-0 z-50 w-64 bg-white shadow-lg transform -translate-x-full lg:translate-x-0 transition-transform duration-200 ease-in-out"
      id="sidebar"
    >
      <div class="flex items-center justify-center h-16 bg-admin-green">
        <h2 class="text-white text-lg font-semibold">Sistema de Reclamos</h2>
      </div>
      <nav class="mt-8">
        <div class="px-4 space-y-2">
          <a
            href="#"
            class="flex items-center px-4 py-2 text-white bg-admin-green rounded-lg"
          >
            Chat con IA
          </a>
        </div>
      </nav>
    </div>

    <!-- Mobile menu button -->
    <div class="lg:hidden fixed top-4 left-4 z-50">
      <button id="menu-toggle" class="bg-admin-green text-white p-2 rounded-md">
        <svg
          class="w-6 h-6"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4 6h16M4 12h16M4 18h16"
          ></path>
        </svg>
      </button>
    </div>

    <!-- Main Content -->
    <div class="lg:ml-64">
      <header
        class="bg-admin-green text-white px-6 py-4 shadow-sm flex items-center justify-between"
      >
        <div>
          <h1 class="text-2xl font-semibold">Chat con IA</h1>
          <p class="text-green-100 text-sm mt-1">
            Asistente Virtual para Reclamos
          </p>
        </div>
        <div class="flex items-center space-x-4">
          <div class="flex items-center space-x-2">
            <span class="text-sm">IA</span>
            <button
              id="ai-toggle"
              class="relative inline-flex h-6 w-11 items-center rounded-full bg-whatsapp-green transition-colors focus:outline-none"
            >
              <span
                id="toggle-dot"
                class="inline-block h-4 w-4 transform rounded-full bg-white transition-transform translate-x-6"
              ></span>
            </button>
            <span class="text-sm" id="status-text">Enabled</span>
          </div>
          <button
            id="cerrar-btn"
            class="bg-white text-admin-green px-4 py-2 rounded-lg hover:bg-gray-100 transition-colors font-medium"
          >
            Cerrar Sesión
          </button>
        </div>
      </header>

      <!-- Chat Content -->
      <main class="px-6 py-8 h-screen">
        <div class="max-w-4xl mx-auto h-full">
          <div
            class="bg-white rounded-lg shadow-sm border border-gray-200 h-full flex flex-col"
          >
            <!-- Chat Header -->
            <div
              class="bg-gray-50 px-6 py-4 border-b border-gray-200 rounded-t-lg flex items-center space-x-3"
            >
              <div
                class="w-10 h-10 bg-whatsapp-green rounded-full flex items-center justify-center"
              >
                <svg
                  class="w-6 h-6 text-white"
                  fill="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    d="M12 2C6.48 2 2 6.48 2 12c0 1.54.36 3.04 1.05 4.35L2 22l5.65-1.05C9.96 21.64 11.46 22 13 22c5.52 0 10-4.48 10-10S17.52 2 12 2z"
                  />
                </svg>
              </div>
              <div>
                <h3 class="font-semibold text-gray-900">Asistente IA</h3>
                <p class="text-sm text-gray-500">En línea</p>
              </div>
            </div>

            <!-- Chat Messages -->
            <div
              id="chat-messages"
              class="flex-1 overflow-y-auto p-6 space-y-4 bg-gray-50"
            ></div>

            <!-- Chat Input -->
            <div
              class="bg-white border-t border-gray-200 p-4 rounded-b-lg flex items-center space-x-3"
            >
              <div class="relative">
                <input
                  type="file"
                  id="file-input"
                  class="hidden"
                  accept="image/*"
                />
                <label
                  for="file-input"
                  class="cursor-pointer p-2 rounded-full bg-gray-100 hover:bg-gray-200 transition-colors"
                  title="Adjuntar archivo"
                >
                  📎
                </label>
              </div>

              <input
                type="text"
                id="message-input"
                placeholder="Escribe tu mensaje..."
                class="flex-1 border border-gray-300 rounded-full px-4 py-2 focus:ring-2 focus:ring-whatsapp-green focus:border-transparent"
              />

              <button
                id="send-button"
                type="button"
                class="bg-whatsapp-green text-white p-2 rounded-full hover:bg-whatsapp-dark transition-colors"
              >
                ➤
              </button>
            </div>

            <!-- Preview Imagen -->
            <div id="preview-container" class="px-4 py-2"></div>
          </div>
        </div>
      </main>
    </div>

    <script src="script.js"></script>
    
    <!-- Script de debug para cerrar sesión -->
    <script>
      // Debug del botón de cerrar sesión
      document.addEventListener("DOMContentLoaded", () => {
        console.log("🔍 Debug: Verificando botón de cerrar sesión...");
        
        const cerrarBtn = document.getElementById("cerrar-btn");
        console.log("🔍 Botón encontrado:", !!cerrarBtn);
        
        if (cerrarBtn) {
          // Agregar event listener adicional para debug
          cerrarBtn.addEventListener("click", (e) => {
            console.log("🔍 Botón de cerrar sesión clickeado!");
            e.preventDefault();
            
            // Verificar localStorage
            const token = localStorage.getItem("token");
            const role = localStorage.getItem("role");
            console.log("🔍 Token:", !!token, "Rol:", role);
            
            if (token) {
              console.log("🔍 Cerrando sesión...");
              localStorage.removeItem("token");
              localStorage.removeItem("role");
              console.log("🔍 localStorage limpiado");
              
              // Redirigir
              setTimeout(() => {
                window.location.href = "/frontend/login.html";
              }, 1000);
            } else {
              console.log("🔍 No hay token, redirigiendo directamente");
              window.location.href = "/frontend/login.html";
            }
          });
          
          console.log("🔍 Event listener de debug agregado");
        } else {
          console.error("🔍 ERROR: Botón de cerrar sesión no encontrado!");
        }
      });
    </script>
  </body>
</html>
